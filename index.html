<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#38bdf8">
<title>イナサト語彙トレ</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="語彙トレ">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f9ff;color:#1e293b;font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:8px 0 2px;color:#0369a1}
.sub{font-size:13px;color:#64748b;margin:0 0 16px}
.card{background:#fff;border-radius:14px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(3,105,161,.12)}
.card h2{font-size:14px;margin:0 0 8px;color:#0369a1}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 14px;border-radius:999px;background:#e0f2fe;border:2px solid #bae6fd;color:#075985;font-size:15px;cursor:pointer;user-select:none;font-family:inherit}
.pill.on{background:#0ea5e9;border-color:#0ea5e9;color:#fff;font-weight:bold}
.note{font-size:12px;color:#64748b;margin:6px 0 0}
.btn{display:block;width:100%;padding:11px;border:none;border-radius:12px;background:#ec4899;color:#fff;font-size:17px;font-weight:bold;cursor:pointer;font-family:inherit}
.btn.sub2{background:#fce7f3;color:#be185d;margin-top:10px;font-size:15px}
.btn:disabled{background:#cbd5e1;color:#fff}
.hidden{display:none}
.head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.head h1{margin:0;font-size:20px}
.btn.mini{display:inline-block;width:auto;padding:4px 14px;font-size:13px;border-radius:999px}
.cmp{padding:10px 10px 4px}
.row{display:flex;gap:6px;align-items:flex-start;margin-bottom:8px}
.row .lb{flex:0 0 46px;font-size:12px;font-weight:bold;color:#075985;padding-top:4px}
.row .pills{gap:5px;flex:1}
.pill{padding:3px 10px;font-size:13px;border-width:1.5px;line-height:1.4}
.pill.q{background:#fff;border-style:dashed}
.brow{display:flex;gap:8px}
.brow .btn:first-child{flex:2;padding:9px;font-size:15px}.brow .btn:last-child{flex:1;font-size:13px;padding:9px 6px}
#setup{margin-top:-34px}
.weak{font-size:12px;margin:8px 0 0}

.topbtn{position:fixed;top:10px;right:10px;z-index:10;padding:4px 12px;border-radius:999px;border:1.5px solid #f9a8d4;background:#fff;color:#be185d;font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 1px 4px rgba(190,24,93,.18)}
.wrap{padding-top:48px}
.qhead{display:flex;justify-content:space-between;font-size:13px;color:#64748b;margin-bottom:6px}
.bar{height:8px;background:#e0f2fe;border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar>i{display:block;height:100%;background:#38bdf8;width:0}
.tbar{height:6px;background:#e0f2fe;border-radius:99px;overflow:hidden;margin-bottom:10px}
.tbar>i{display:block;height:100%;background:#f59e0b;width:100%}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:#e0f2fe;color:#075985;margin-right:6px}
.word{font-size:30px;font-weight:bold;text-align:center;margin:6px 0 0;color:#0f172a;word-break:keep-all}
.yomi{text-align:center;color:#64748b;font-size:13px;min-height:20px;margin-bottom:6px}
.ask{text-align:center;font-size:12px;color:#64748b;margin-bottom:6px}
.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:6px 10px;margin-bottom:6px;border-radius:12px;background:#e0f2fe;border:2px solid #bae6fd;color:#1e293b;font-size:14.5px;cursor:pointer;font-family:inherit}
.choice b{flex:0 0 26px;height:26px;border-radius:50%;background:#fff;border:2px solid #bae6fd;color:#0284c7;display:flex;align-items:center;justify-content:center;font-size:13px}
.choice.ok{background:#dcfce7;border-color:#22c55e}
.choice.sel{background:#bae6fd;border-color:#38bdf8}
.choice.ok b{background:#22c55e;border-color:#22c55e;color:#fff}
.choice.ng{background:#fee2e2;border-color:#ef4444}
.choice.ng b{background:#ef4444;border-color:#ef4444;color:#fff}
.choice:disabled{cursor:default}
.fb{text-align:center;font-weight:bold;min-height:26px;margin:2px 0 6px}
.fb.ok{color:#16a34a}.fb.ng{color:#dc2626}
.lvl{font-size:30px;font-weight:bold;text-align:center;color:#be185d;margin:4px 0 2px}
.lrow{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.lrow .n{flex:0 0 40px;font-weight:bold;color:#075985}
.lrow .b{flex:1;height:16px;background:#e0f2fe;border-radius:99px;overflow:hidden}
.lrow .b i{display:block;height:100%;background:#38bdf8;border-radius:99px}
.lrow .b i.hi{background:#f472b6}
.lrow .p{flex:0 0 96px;text-align:right;color:#334155;font-size:13px}
.jcard{background:#fff0f7;border:2px solid #fbcfe8}
.score{font-size:44px;font-weight:bold;text-align:center;color:#0369a1;margin:6px 0}
.rl{font-size:14px;border-top:1px solid #e2e8f0;padding:8px 0}
.rl .w{font-weight:bold}
.rl .m{color:#475569;font-size:13px}
.weak{font-size:13px;color:#475569;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<button class="topbtn hidden" id="topBtn">▲ トップページ</button>

<div id="setup">
  <div class="head"><h1><img src="favicon-32.png" alt="" width="22" height="22" style="vertical-align:-4px;border-radius:5px;margin-right:6px">イナサト語彙トレ</h1><button class="btn mini" id="jitsuBtn">実力テスト</button></div>

  <div class="card cmp">
    <div class="row"><span class="lb">種類</span><div class="pills" id="gType">
      <button class="pill on" data-v="AB">A＋B</button>
      <button class="pill" data-v="A">A 説明文</button>
      <button class="pill" data-v="B">B 物語文</button></div></div>
    <div class="row"><span class="lb">学年</span><div class="pills"><span id="gLv" style="display:contents"></span><span id="gLvQuick" style="display:contents">
      <button class="pill q" data-q="all">全部</button>
      <button class="pill q" data-q="s">小学生</button>
      <button class="pill q" data-q="c">中学生</button>
      <button class="pill q" data-q="clr">クリア</button></span></div></div>
    <div class="row"><span class="lb">問題数</span><div class="pills" id="gCount">
      <button class="pill" data-v="10">10問</button>
      <button class="pill on" data-v="20">20問</button>
      <button class="pill" data-v="30">30問</button>
      <button class="pill" data-v="40">40問</button></div></div>
    <div class="row"><span class="lb">時間</span><div class="pills" id="gMode">
      <button class="pill on" data-v="0">マイペース</button>
      <button class="pill" data-v="7">7秒</button>
      <button class="pill" data-v="5">5秒</button>
      <button class="pill" data-v="3">3秒</button></div></div>
  </div>

  <div class="brow">
    <button class="btn" id="startBtn">テスト開始</button>
    <button class="btn sub2" id="weakBtn" style="margin-top:0">苦手 <span id="weakN">0</span>語</button>
  </div>
  <p class="weak" id="poolInfo"></p>
</div>

<div id="quiz" class="hidden">
  <div class="qhead"><span id="qNo"></span><span id="qScore"></span></div>
  <div class="bar"><i id="pBar"></i></div>
  <div class="card">
    <div id="tBarWrap" class="tbar hidden"><i id="tBar"></i></div>
    <div><span class="tag" id="qTag"></span></div>
    <div class="word" id="qWord"></div>
    <div class="yomi" id="qYomi"></div>
    <div class="ask">この言葉の意味は？</div>
    <div id="choices"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hidden" id="nextBtn">次へ</button>
  </div>
</div>

<div id="result" class="hidden">
  <div class="card">
    <h2>結果</h2>
    <div class="score" id="rScore"></div>
    <div style="text-align:center;color:#64748b" id="rMsg"></div>
  </div>
  <div class="card jcard hidden" id="rLevelCard">
    <h2 style="color:#be185d">実力テストの判定</h2>
    <div class="lvl" id="rLevel"></div>
    <div style="text-align:center;font-size:13px;color:#475569;margin-bottom:10px" id="rLevelSub"></div>
    <div id="rBars"></div>
    <p class="note">判定：正答率70%以上だった学年のうち、いちばん上の学年（各学年8〜9問）。</p>
  </div>
  <div class="card" id="rWrongCard"><h2>まちがえた語</h2><div id="rWrong"></div></div>
  <button class="btn" id="againBtn">もう一度</button>
  <button class="btn sub2" id="homeBtn">設定にもどる</button>
</div>

</div>

  b.onclick=()=>{
    const q=b.dataset.q;
    st.lvs = new Set(q==="clr"?[]:q==="all"?[1,2,3,4,5,6]:q==="s"?[1,2,3]:[4,5,6]);
    refresh();
  };
});
function pool(){ return WORDS.filter(w=>st.lvs.has(w.lv) && st.type.includes(w.t)); }
function refresh(){
  $("#gType").querySelectorAll(".pill").forEach(b=>b.classList.toggle("on",b.dataset.v===st.type));
  $("#gCount").querySelectorAll(".pill").forEach(b=>b.classList.toggle("on",+b.dataset.v===st.count));
  $("#gMode").querySelectorAll(".pill").forEach(b=>b.classList.toggle("on",+b.dataset.v===st.mode));
  buildLv();
  const n=pool().length;
  $("#poolInfo").textContent = st.lvs.size ? `この範囲の語数：${n}語（全${WORDS.length}語）` : "学年を選んでください（複数OK）";
  $("#weakN").textContent=weakCount();
  $("#weakBtn").disabled = weakCount()===0;
  $("#startBtn").disabled = n<4;
}

/* ---- 出題づくり ---- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* 正解位置(①〜⑥)が偏らないよう、0〜5を1セットにして混ぜながら並べる */
function balancedPositions(n){
  let arr=[]; while(arr.length<n) arr=arr.concat(shuffle([0,1,2,3]));
  return arr.slice(0,n);
}
function makeChoices(word, pos){
  // ひっかけは同じ種類で、同じ学年か隣の学年から。意味が同じものは除く
  // ひっかけ：同じ種類・同じか隣の学年で、意味の文が似すぎていないものだけ
  let cand=WORDS.filter(x=>x.id!==word.id && x.t===word.t && Math.abs(x.lv-word.lv)<=1 && x.m!==word.m && sim(x.bg,word.bg)<0.6);
  if(cand.length<3) cand=WORDS.filter(x=>x.id!==word.id && x.t===word.t && x.m!==word.m);
  const ds=shuffle(cand).slice(0,3).map(x=>x.m);
  const ch=ds.slice(); ch.splice(pos,0,word.m);
  return ch;
}
function curLimit(){ return jitsu?13:st.mode; }
function scoreText(){ return jitsu?"":`正解 ${correct}`; }
function jitsuWords(){
  // 6学年を8〜9問ずつ（計50問）、各学年でA/Bを半々に
  const extra=new Set(shuffle([1,2,3,4,5,6]).slice(0,2)); let out=[];
  for(let lv=1;lv<=6;lv++){
    const n=extra.has(lv)?9:8, na=Math.ceil(n/2)-(Math.random()<.5&&n%2===1?1:0), nb=n-na;
    out=out.concat(shuffle(WORDS.filter(w=>w.lv===lv&&w.t==="A")).slice(0,na), shuffle(WORDS.filter(w=>w.lv===lv&&w.t==="B")).slice(0,nb));
  }
  return out;
}
function startQuiz(words, cfg){
  lastCfg=cfg;
  Q=shuffle(words).slice(0,cfg.count);
  const pos=balancedPositions(Q.length);
  Q=Q.map((w,i)=>({w, pos:pos[i], ch:makeChoices(w,pos[i])}));
  idx=0; correct=0; wrongList=[];
  $("#setup").classList.add("hidden"); $("#result").classList.add("hidden"); $("#quiz").classList.remove("hidden"); $("#topBtn").classList.remove("hidden");
  show();
}

/* ---- 出題画面 ---- */
const MARK=["①","②","③","④"];
function show(){
  locked=false;
  const q=Q[idx], w=q.w;
  $("#qNo").textContent=`第 ${idx+1} 問 / ${Q.length}`;
  $("#qScore").textContent=scoreText();
  $("#pBar").style.width=(idx/Q.length*100)+"%";
  $("#qTag").textContent=`${LV_NAME[w.lv]}・${TYPE_NAME[w.t]}`;
  $("#qWord").textContent=w.w;
  $("#qYomi").textContent = (w.r!==w.w)?`（${w.r}）`:"";
  $("#fb").textContent=""; $("#fb").className="fb";
  $("#nextBtn").classList.add("hidden");
  const box=$("#choices"); box.innerHTML="";
  q.ch.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="choice"; b.innerHTML=`<b>${MARK[i]}</b><span></span>`; b.querySelector("span").textContent=t;
    b.onclick=()=>answer(i);
    box.appendChild(b);
  });
  clearInterval(timer);
  if(curLimit()>0){
    $("#tBarWrap").classList.remove("hidden");
    const lim=curLimit()*1000; tStart=Date.now(); $("#tBar").style.width="100%";
    timer=setInterval(()=>{
      const left=lim-(Date.now()-tStart);
      $("#tBar").style.width=Math.max(0,left/lim*100)+"%";
      if(left<=0){ clearInterval(timer); answer(-1); }
    },50);
  }else{ $("#tBarWrap").classList.add("hidden"); }
}
function answer(i){
  if(locked) return; locked=true; clearInterval(timer);
  const q=Q[idx], btns=[...document.querySelectorAll(".choice")];
  btns.forEach(b=>b.disabled=true);
  q.res=(i===q.pos);
  const fb=$("#fb");
  if(jitsu){
    if(i>=0) btns[i].classList.add("sel"); else { fb.textContent="時間切れ"; fb.classList.add("ng"); }
    if(q.res){ if(weak[q.w.key]){ weak[q.w.key].streak=(weak[q.w.key].streak||0)+1; if(weak[q.w.key].streak>=5) delete weak[q.w.key]; } correct++; }
    else{ wrongList.push(q.w); weak[q.w.key]={streak:0}; }
    saveWeak();
    const my=idx; autoT=setTimeout(()=>{ if(my===idx && jitsu && !$("#quiz").classList.contains("hidden")) nextQ(); }, i<0?700:350);
    return;
  }
  btns[q.pos].classList.add("ok");
  if(i===q.pos){
    correct++; fb.textContent="せいかい！"; fb.classList.add("ok");
    if(weak[q.w.key]){ weak[q.w.key].streak=(weak[q.w.key].streak||0)+1; if(weak[q.w.key].streak>=5) delete weak[q.w.key]; }
  }else{
    btns[i]&&btns[i].classList.add("ng");
    fb.textContent = i<0 ? "時間切れ…" : "ざんねん…"; fb.classList.add("ng");
    wrongList.push(q.w);
    weak[q.w.key]={streak:0};
  }
  saveWeak();
  $("#qScore").textContent=scoreText();
  const nb=$("#nextBtn"); nb.textContent = idx+1<Q.length ? "次へ" : "結果を見る";
  if(i===q.pos){
    const my=idx; autoT=setTimeout(()=>{ if(my===idx && !$("#quiz").classList.contains("hidden")) nextQ(); },700);
  }else{ nb.classList.remove("hidden"); }
}
function nextQ(){ clearTimeout(autoT); idx++; if(idx<Q.length) show(); else finish(); }
$("#nextBtn").onclick=nextQ;

function renderLevel(){
  const per={}; for(let lv=1;lv<=6;lv++) per[lv]={n:0,c:0};
  const ab={A:{n:0,c:0},B:{n:0,c:0}};
  Q.forEach(q=>{ per[q.w.lv].n++; ab[q.w.t].n++; if(q.res){ per[q.w.lv].c++; ab[q.w.t].c++; } });
  const pc=o=>o.n?Math.round(o.c/o.n*100):0;
  let top=0; for(let lv=1;lv<=6;lv++) if(per[lv].n && pc(per[lv])>=70) top=lv;
  $("#rLevel").textContent = top? `あなたは ${LV_NAME[top]}レベル` : `あなたは ${LV_NAME[1]}レベルの手前`;
  $("#rLevelSub").textContent = top===6 ? "中3の語も70%以上正解できました。すばらしい！" :
    top? `${LV_NAME[top]}の語で70%以上正解できました。次は ${LV_NAME[top+1]} の語がねらい目です。` : "まずは小4の語から、しっかり固めましょう。";
  let h=""; for(let lv=1;lv<=6;lv++){ const o=per[lv], p=pc(o);
    h+=`<div class="lrow"><span class="n">${LV_NAME[lv]}</span><span class="b"><i class="${p>=70?"hi":""}" style="width:${p}%"></i></span><span class="p">${p}%（${o.c}/${o.n}）</span></div>`; }
  h+=`<div class="lrow" style="margin-top:14px"><span class="n" style="flex:0 0 auto">A 説明文</span><span class="p" style="text-align:left">${pc(ab.A)}%（${ab.A.c}/${ab.A.n}）</span><span class="n" style="flex:0 0 auto;margin-left:10px">B 物語文</span><span class="p" style="text-align:left">${pc(ab.B)}%（${ab.B.c}/${ab.B.n}）</span></div>`;
  $("#rBars").innerHTML=h;
}
function finish(){
  clearInterval(timer);
  $("#quiz").classList.add("hidden"); $("#result").classList.remove("hidden");
  const n=Q.length, pct=Math.round(correct/n*100);
  $("#rScore").textContent=`${correct} / ${n}`;
  $("#rMsg").textContent=`正答率 ${pct}%　`+(pct===100?"パーフェクト！":pct>=80?"よくできました！":pct>=60?"あと少し！まちがえた語を見直そう":"まちがえた語をくり返して覚えよう");
  const lc=$("#rLevelCard");
  if(jitsu){ lc.classList.remove("hidden"); renderLevel(); } else lc.classList.add("hidden");
  const box=$("#rWrong"); box.innerHTML="";
  $("#rWrongCard").classList.toggle("hidden",!wrongList.length);
  wrongList.forEach(w=>{
    const d=document.createElement("div"); d.className="rl";
    d.innerHTML=`<span class="w"></span> <span class="m"></span>`;
    d.querySelector(".w").textContent=w.w+(w.r!==w.w?`（${w.r}）`:"");
    d.querySelector(".m").textContent="… "+w.m;
    box.appendChild(d);
  });
}

$("#startBtn").onclick=()=>{ jitsu=false; weakMode=false; startQuiz(pool(),{count:st.count}); };
$("#jitsuBtn").onclick=()=>{ jitsu=true; weakMode=false; startQuiz(jitsuWords(),{count:50}); };
$("#weakBtn").onclick=()=>{
  jitsu=false; weakMode=true;
  const ws=Object.keys(weak).map(k=>BYKEY[k]).filter(Boolean);
  if(ws.length) startQuiz(ws,{count:Math.min(st.count,ws.length)});
};
$("#againBtn").onclick=()=>{
  if(jitsu){ startQuiz(jitsuWords(),{count:50}); return; }
  if(weakMode){ const ws=Object.keys(weak).map(k=>BYKEY[k]).filter(Boolean); if(!ws.length){goHome();return;} startQuiz(ws,{count:Math.min(st.count,ws.length)}); }
  else startQuiz(pool(),{count:st.count});
};
function goHome(){ clearInterval(timer); clearTimeout(autoT); $("#result").classList.add("hidden"); $("#quiz").classList.add("hidden"); $("#setup").classList.remove("hidden"); $("#topBtn").classList.add("hidden"); refresh(); }
$("#homeBtn").onclick=goHome; $("#topBtn").onclick=goHome;
refresh();
</script>
